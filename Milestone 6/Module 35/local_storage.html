<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage</title>
</head>
<body>
    <!-- 
        --------- LOCAL STORAGE -----------
        // Basics
        - it's a web api
        - it's a way to store key-value pairs in the client-side
        - it's a non-persistent storage
        - both key and value are string

        // Methods
        - localStorage.setItem(key, value)
        - localStorage.getItem(key)
        - localStorage.removeItem(key)
        - localStorage.clear()

        // Limitations
        - store data as a string
        - every value goes as value.toString()
        - array: [1, 2, 3] -> "1, 2, 3"
        - object: {a: 1, b: 2} -> "[object Object]"
    -->
</body>
</html>
