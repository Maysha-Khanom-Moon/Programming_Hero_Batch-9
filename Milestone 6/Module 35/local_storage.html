<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage</title>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <!-- 
        --------- LOCAL STORAGE -----------
        // Basics
        - it's a web api
        - it's a way to store key-value pairs in the client-side
        - it's a persistent storage
        - both key and value are string

        // Methods
        - localStorage.setItem(key, value)
        - localStorage.getItem(key)
        - localStorage.removeItem(key)
        - localStorage.clear()

        // Limitations
        - store data as a string
        - every value goes as value.toString()
        - array: [1, 2, 3] ==> "1, 2, 3"
        - object: {a: 1, b: 2} ==> "[object Object]"

        // Solution
        - JSON.stringify() ==> convert object to json
        - JSON.parse() ==> convert json to object
    -->


    <!-- shopping cart -->
    <div style="margin-bottom: 10px;">
        <input type="text" id="product-name" placeholder="Product">
        <input type="text" id="product-quantity" placeholder="Quantity">
        <button onclick="addProduct()" id="product-add">Add Product</button>
    </div>

    <div>
        <table>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
            </tr>
            <tbody id="product-list">

            </tbody>
        </table>
    </div>

    <!-- script -->
    <script>
        localStorage.setItem('drink', 'coke');
        console.log(localStorage.getItem('drink'));

        // add product
        function addProduct() {
            const product = document.getElementById('product-name');
            const quantity = document.getElementById('product-quantity');
            
            const productName = product.value;
            const productQuantity = quantity.value;
            if(productName && productQuantity) {
                console.log(productName, productQuantity);

                product.value = '';
                quantity.value = '';

                storeAddedProduct(productName, productQuantity);
            }
        }

        // display product
        function displayProduct() {
            const table = document.getElementById('product-list');
            table.innerHTML = '';

            const cart = getAddedProduct();
            for (let product in cart) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${product}</td>
                    <td>${cart[product]}</td>
                `;
                table.appendChild(tr);
            }
        }
        displayProduct();

        // get added product
        function getAddedProduct() {
            const storedCart = localStorage.getItem('cart');
            // console.log(storedCart);
            return storedCart ? JSON.parse(storedCart) : {};
        }

        // store added product
        function storeAddedProduct(name, quantity) {
            localStorage.setItem(name, quantity);

            let cart = getAddedProduct();
            // console.log(cart);

            cart[name] = quantity;
            localStorage.setItem('cart', JSON.stringify(cart));
            // console.log(cart);

            displayProduct();
        }
    </script>
</body>
</html>
